<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>晴天航行 · Sunny Voyage</title>
  <style>
    @font-face { font-family: PatrickHand; src: url('../fonts/PatrickHand-Regular.woff2') format('woff2'); font-display: swap; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #173f5f; }
    body { font-family: PatrickHand, "Songti SC", "Noto Serif CJK SC", serif; }
    #backdrop, #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; z-index: 2; top: max(22px, env(safe-area-inset-top)); left: max(26px, env(safe-area-inset-left)); color: #fff4d2; pointer-events: none; text-shadow: 0 2px 0 rgba(18, 57, 83, .28); }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 52px); font-weight: 400; letter-spacing: .02em; }
    .subtitle { margin-top: 2px; font-family: "Songti SC", "Noto Serif CJK SC", serif; font-size: 13px; letter-spacing: .24em; opacity: .9; }
    #pause { position: fixed; z-index: 3; top: max(24px, env(safe-area-inset-top)); right: max(26px, env(safe-area-inset-right)); border: 2px solid rgba(255,244,210,.8); background: rgba(24,67,96,.38); color: #fff4d2; border-radius: 999px; padding: 8px 17px; font: 16px PatrickHand, "Songti SC", serif; cursor: pointer; backdrop-filter: blur(5px); }
    #pause:focus-visible { outline: 3px solid #fff4d2; outline-offset: 3px; }
    .hint { position: fixed; z-index: 2; right: max(28px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); color: rgba(255,244,210,.82); font-size: 14px; letter-spacing: .08em; pointer-events: none; }
    #loading { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; color: #fff4d2; background: #285f86; font-size: 22px; letter-spacing: .12em; transition: opacity .25s ease; }
    #loading.done { display: none; }
    #loading.error { padding: 32px; color: #fff; background: #713f3b; white-space: pre-wrap; font: 15px/1.6 ui-monospace, monospace; }
    @media (max-width: 700px) { .hint { display: none; } .subtitle { font-size: 11px; } }
    @media (max-height: 500px) { .hud { top: auto; bottom: max(14px, env(safe-area-inset-bottom)); } .hud h1 { font-size: 28px; } .subtitle, .hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <canvas id="stage" aria-label="儿童蜡笔绘本风晴天航行场景"></canvas>
  <header class="hud"><h1>Sunny Voyage</h1><div class="subtitle">晴天航行 · 一张纸上的小小旅程</div></header>
  <button id="pause" type="button" aria-label="暂停或继续动画">暂停</button>
  <div class="hint">自动航行中 · 空格暂停</div>
  <div id="loading">正在铺开海画纸…</div>
  <script src="./scene.js" defer></script>
</body>
</html>
